<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Dahyun Birthday Party 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url("0100.png");

    background-size:cover;
    background-position:center;

    font-family:
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

.card{
    width:100%;
    max-width:460px;

    background:rgba(255,255,255,.95);

    border-radius:24px;

    padding:35px 28px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.25);

    backdrop-filter:blur(10px);
}

.photo{
    width:220px;
    height:220px;

    border-radius:50%;
    object-fit:cover;
    object-position:center center;

    border:4px solid #ff7ba7;

    margin-bottom:20px;
}

h1{
    color:#ff4f87;
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
    line-height:1.7;
}

.invite-box{
    background:#fff5f8;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

.info{
    margin:12px 0;
    line-height:1.7;
    color:#333;
}

.highlight{
    color:#ff4f87;
    font-weight:bold;
}

.countdown-box{
    background:#fff5f8;
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
}

.countdown-box h3{
    color:#ff4f87;
    margin-bottom:10px;
}

#countdown{
    font-size:22px;
    font-weight:bold;
    color:#ff4f87;
}

.map-btn,
.music-btn,
.btn{
    display:block;
    width:100%;

    border:none;
    border-radius:50px;

    padding:15px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    text-decoration:none;

    margin-bottom:12px;
}

.map-btn{
    background:#03C75A;
    color:white;
}

.music-btn{
    background:#ff8db3;
    color:white;
}

.btn{
    background:#ff4f87;
    color:white;
}

.result{
    display:none;
    margin-top:20px;

    font-size:20px;
    font-weight:bold;

    color:#ff4f87;
}

.emoji{
    position:fixed;
    pointer-events:none;
    animation:float 3s linear forwards;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:1;
    }

    to{
        transform:translateY(-350px);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="card">

    <img src="007.png" class="photo" alt="Dahyun">

    <h1>🎂 Happy Birthday Dahyun 🎂</h1>

    <p class="subtitle">
        다현이의 생일파티에 초대합니다 💖
    </p>

    <div class="invite-box">

        <div class="info">
            📅 <span class="highlight">2026년 6월 6일</span>
        </div>

        <div class="info">
            🕔 <span class="highlight">오후 5시</span>
        </div>

        <div class="info">
            📍 양주시 장흥면 가마골로 40-8<br>
            우남송추아파트 103동 902호
        </div>

    </div>

    <div class="countdown-box">
        <h3>🎂 Birthday Countdown 🎂</h3>
        <div id="countdown">계산중...</div>
    </div>

    <a
        class="map-btn"
        href="https://map.naver.com/v5/search/%EC%96%91%EC%A3%BC%EC%8B%9C%20%EC%9E%A5%ED%9D%A5%EB%A9%B4%20%EA%B0%80%EB%A7%88%EA%B3%A8%EB%A1%9C%2040-8"
        target="_blank">
        📍 네이버 지도 열기
    </a>

    <button class="music-btn" id="musicBtn">
        🎵 BGM 재생
    </button>

    <audio id="bgm" loop>
        <source src="birthday00.mp3" type="audio/mpeg">
    </audio>

    <button class="btn" id="joinBtn">
        🎉 참석하기 🎉
    </button>

    <div class="result" id="result">
        💖 초대 수락 완료! 💖<br>
        토마토 왕국에서 만나요 🍅👑
    </div>

</div>

<script>

/* 카운트다운 */

const countdown =
document.getElementById("countdown");

const targetDate =
new Date("2026-06-08T00:00:00");

function updateCountdown(){

    const now = new Date();

    const diff = targetDate - now;

    if(diff <= 0){

        countdown.innerHTML =
        "🎉 Happy Birthday Dahyun 🎉";

        return;
    }

    const days =
    Math.floor(diff/(1000*60*60*24));

    const hours =
    Math.floor(
        (diff%(1000*60*60*24))
        /(1000*60*60)
    );

    const minutes =
    Math.floor(
        (diff%(1000*60*60))
        /(1000*60)
    );

    const seconds =
    Math.floor(
        (diff%(1000*60))
        /1000
    );

    countdown.innerHTML =
    `${days}일 ${hours}시간 ${minutes}분 ${seconds}초`;
}

updateCountdown();

setInterval(updateCountdown,1000);

/* 음악 */

const bgm =
document.getElementById("bgm");

const musicBtn =
document.getElementById("musicBtn");

let playing = false;

musicBtn.addEventListener("click",()=>{

    if(!playing){

        bgm.play();

        musicBtn.textContent =
        "⏸️ BGM 정지";

        playing = true;

    }else{

        bgm.pause();

        musicBtn.textContent =
        "🎵 BGM 재생";

        playing = false;
    }

});

/* 참석 버튼 */

const joinBtn =
document.getElementById("joinBtn");

const result =
document.getElementById("result");

joinBtn.addEventListener("click",()=>{

    result.style.display = "block";

    createEffect();

});

function createEffect(){

    const emojis =
    ["🍅","🎂","🎉","💖","✨","👑"];

    for(let i=0;i<40;i++){

        const e =
        document.createElement("div");

        e.className = "emoji";

        e.textContent =
        emojis[Math.floor(
            Math.random()*emojis.length
        )];

        e.style.left =
        Math.random()*window.innerWidth + "px";

        e.style.top =
        window.innerHeight + "px";

        e.style.fontSize =
        (20 + Math.random()*20) + "px";

        document.body.appendChild(e);

        setTimeout(()=>{
            e.remove();
        },3000);
    }

}

</script>

</body>
</html>
